services:
  selenium_hub6:
    image: selenium/hub:latest
    container_name: selenium_hub6
    ports:
      - 4442:4442
      - 4443:4443
      - 4444:4444
  
  chrome:
    image: selenium/node-chrome:beta
    shm_size: 2gb
    depends_on:
      - selenium_hub6
    environment:
      - SE_EVENT_BUS_HOST=selenium_hub6
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
  
  chrome1:
    image: selenium/node-chrome:beta
    shm_size: 2gb
    depends_on:
      - selenium_hub6
    environment:
      - SE_EVENT_BUS_HOST=selenium_hub6
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443    
