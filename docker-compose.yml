# Note: It requires docker-compose 1.13.0
#
# Usage: docker-compose up -d
version: "2.2"

services:
  # Selenium hub
  selenium_hub3:
    image: selenium/hub:3.14.0-curium
    ports:
      - 4444:4444
      - 4462:4462
      - 4463:4463      
  
  real_device:
    image: appium/appium
    depends_on:
      - selenium_hub3
    network_mode: "service:selenium_hub3"
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ~/.android:/root/.android
      - $PWD/example/sample_apk:/root/tmp
    environment:
      - CONNECT_TO_GRID=true
      - SELENIUM_HOST=selenium_hub3
      - RELAXED_SECURITY=true
  
  nexus_7.1.1:
    image: oklabs/docker-android-x86-7.1.1:latest
    privileged: true
    scale: 1
    depends_on:
      - selenium_hub3
      - real_device
    ports:
      - 6080:6080
      - 4723:4723
      - 5554:5554
      - 5555:5555
    volumes:
      - $PWD/example/sample_apk:/root/tmp/sample_apk
      - ./video-nexus_7.1.1:/tmp/video
    environment:
      - DEVICE=Nexus 5
      - CONNECT_TO_GRID=true
      - APPIUM=true
      - SELENIUM_HOST=selenium_hub3
      - AUTO_RECORD=true
  
  chrome:
    image: selenium/node-chrome:beta
    shm_size: 2gb
    depends_on:
      - selenium_hub3
    environment:
      - SE_EVENT_BUS_HOST=selenium_hub3
      - SE_EVENT_BUS_PUBLISH_PORT=4462
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4463
